name: Test SSH Connection

on:
  push:
    branches: [main]

jobs:
  test-connection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Настройка SSH-доступа
      - name: Install SSH Key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY_PRIVATE }}

      - name: Setup SSH known hosts
        run: |
          mkdir -p ~/.ssh
          touch ~/.ssh/known_hosts
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/known_hosts

          echo "Проверяем подключение..."
          if ! ssh-keyscan -v -H -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>&1; then
            echo "Ошибка подключения. Пробуем альтернативные методы..."
            ssh-keyscan -H -p ${{ secrets.SSH_PORT }} 81.177.141.146 >> ~/.ssh/known_hosts || true
          fi

          echo "Содержимое known_hosts:"
          cat ~/.ssh/known_hosts

      # Создаем тестовый файл и копируем на сервер
      - name: Test SCP transfer
        run: |
          echo "This is a test file" > testfile.txt
          scp -P ${{ secrets.SSH_PORT }} testfile.txt ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/testfile.txt
          echo "Файл успешно скопирован"

      # Проверяем, что файл скопировался
      - name: Verify file transfer
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cat /tmp/testfile.txt && rm /tmp/testfile.txt"