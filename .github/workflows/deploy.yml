name: Deploy to Server

on:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    branches: [main]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY_PRIVATE }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            docker stop lunch-bot || true
            docker rm lunch-bot || true
            docker run -d \
              --name lunch-bot \
              -e TOKEN=${{ secrets.TOKEN }} \
              -e ADMIN=${{ secrets.ADMIN }} \
              -e MANAGER=${{ secrets.MANAGER }} \
              -e FIX_SUM=${{ secrets.FIX_SUM }} \
              -e currency=${{ secrets.CURRENCY }} \
              -e LOG_FILE=${{ secrets.LOG_FILE }} \
              -e PORT_DB=${{ secrets.PORT_DB }} \
              -e USER_DB=${{ secrets.USER_DB }} \
              -e PASSWORD_DB=${{ secrets.PASSWORD_DB }} \
              -e HOST_DB=${{ secrets.HOST_DB }} \
              -e DATABASE_NAME=${{ secrets.DATABASE_NAME }} \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
      - name: Restart bot
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
          "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest && \
          docker restart lunch-bot || true"