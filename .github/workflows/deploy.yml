name: Build and Deploy Bot

on:
  push:
    branches: [main]

env:
  CONTAINER_NAME: "lunch-bot"
  DOCKER_IMAGE: "lunch-bot-image"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Сборка Docker-образа
      - name: Build Docker image
        run: |
          docker build -t $DOCKER_IMAGE .

      # Сохранение образа в архив (для переноса на сервер)
      - name: Save Docker image
        run: docker save -o image.tar $DOCKER_IMAGE

      # Настройка SSH-доступа
      - name: Install SSH Key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY_PRIVATE }}

      - name: Setup SSH known hosts
        run: |
          mkdir -p ~/.ssh
          touch ~/.ssh/known_hosts
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/known_hosts

          echo "Проверяем подключение..."
          if ! ssh-keyscan -v -H -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>&1; then
            echo "Ошибка подключения. Пробуем альтернативные методы..."
            # Попробуйте использовать IP, если использовали домен
            ssh-keyscan -H -p ${{ secrets.SSH_PORT }} retbot.ru >> ~/.ssh/known_hosts || true
          fi

          echo "Содержимое known_hosts:"
          cat ~/.ssh/known_hosts

      # Копирование образа на сервер и запуск
      - name: Deploy to Server
        run: |
          # Копируем архив с образом
          scp -P ${{ secrets.SSH_PORT }} image.tar ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/image.tar

          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} <<EOF
            docker load -i /tmp/image.tar
            rm /tmp/image.tar

            # Останавливаем старый контейнер (если есть)
            docker stop $CONTAINER_NAME || true
            docker rm $CONTAINER_NAME || true

            docker run -d \
              --name $CONTAINER_NAME \
              --restart unless-stopped \
              -e TOKEN='${{ secrets.TOKEN }}' \
              -e ADMIN='${{ secrets.ADMIN }}' \
              -e MANAGER='${{ secrets.MANAGER }}' \
              -e PORT_DB='${{ secrets.PORT_DB }}' \
              -e USER_DB='${{ secrets.USER_DB }}' \
              -e PASSWORD_DB='${{ secrets.PASSWORD_DB }}' \
              -e HOST_DB='${{ secrets.HOST_DB }}' \
              -e DATABASE_NAME='${{ secrets.DATABASE_NAME }}' \
              -e DATABASE_URL="mysql+asyncmy://${{ secrets.USER_DB }}:${{ secrets.PASSWORD_DB }}@${{ secrets.HOST_DB }}/${{ secrets.DATABASE_NAME }}" \
              $DOCKER_IMAGE
          EOF