name: Test SSH/SCP Connection

on: [push]

jobs:
  test-connection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH Key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY_PRIVATE }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_HOST }}:${{ secrets.SSH_PORT }} ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC..." >> ~/.ssh/known_hosts
          # Или использовать ваш вариант с ssh-keyscan

      - name: Test SSH connection
        run: |
          echo "Testing SSH connection..."
          ssh -p ${{ secrets.SSH_PORT }} -T ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "echo 'SSH connection successful!'"

      - name: Create test file
        run: echo "This is a test file" > testfile.txt

      - name: Test SFTP
        run: |
          echo "put testfile.txt /tmp/testfile.txt" > sftp_batch.txt
          sftp -b sftp_batch.txt -P ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}

      - name: Test SCP with verbose output
        run: |
          echo "Testing SCP connection with verbose output..."
          scp -v -P ${{ secrets.SSH_PORT }} testfile.txt ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/testfile.txt || true
          echo "SCP exit code: $?"

      - name: Check remote file
        if: always()
        run: |
          echo "Checking if file exists on server..."
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "ls -la /tmp/testfile.txt || echo 'File not found'"