name: Deploy with Docker Compose

on:
  push:
    branches: [main]

env:
  DEPLOY_DIR: /root/lunch-bot-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    # test
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH Key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Copy project files to server
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }}" ./ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$DEPLOY_DIR

      - name: Upload and decode .env
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} <<EOF
            mkdir -p $DEPLOY_DIR
            echo '${{ secrets.ENV }}' | base64 --decode > $DEPLOY_DIR/.env && \
            chmod 600 $DEPLOY_DIR/.env

          EOF

      - name: Run Docker Compose
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} <<EOF
            cd $DEPLOY_DIR
          
            # Удаляем конфликтующий контейнер, если он существует
            docker rm -f lunch-bot-ci || true
          
            # Удаляем старую сеть, если осталась
            docker network rm lunch-bot-deploy_default || true
          
            # Поднимаем сервис заново
            docker compose up -d --build --remove-orphans --force-recreate
          EOF
