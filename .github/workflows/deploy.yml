name: Build and Deploy Bot

on:
  push:
    branches: [main]

env:
  CONTAINER_NAME: "lunch-bot"
  DOCKER_IMAGE: "lunch-bot-image"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH Key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Сборка Docker-образа
      - name: Build Docker image
        run: |
          docker build -t $DOCKER_IMAGE .

      # Сохранение образа в архив
      - name: Save Docker image
        run: docker save -o image.tar $DOCKER_IMAGE

      # Копирование и деплой.
      - name: Deploy to Server
        run: |
          scp -o StrictHostKeyChecking=no -P ${{ secrets.SSH_PORT }} image.tar ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/image.tar

          ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} /bin/bash <<EOF
            # Загрузка образа
            docker load -i /tmp/image.tar
            rm -f /tmp/image.tar

            # Остановка старого контейнера
            docker stop $CONTAINER_NAME 2>/dev/null || true
            docker rm $CONTAINER_NAME 2>/dev/null || true

            # Запуск нового контейнера
            docker run -d \\
              --name $CONTAINER_NAME \\
              --restart=unless-stopped \\
              -e TOKEN='$TOKEN' \\
              -e ADMIN='$ADMIN' \\
              -e MANAGER='$MANAGER' \\
              -e PORT_DB='$PORT_DB' \\
              -e USER_DB='$USER_DB' \\
              -e PASSWORD_DB='$PASSWORD_DB' \\
              -e HOST_DB='$HOST_DB' \\
              -e DATABASE_NAME='$DATABASE_NAME' \\
              $DOCKER_IMAGE
          EOF
        env:
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          DOCKER_IMAGE: ${{ env.DOCKER_IMAGE }}
          TOKEN: ${{ secrets.TOKEN }}
          ADMIN: ${{ secrets.ADMIN }}
          MANAGER: ${{ secrets.MANAGER }}
          PORT_DB: ${{ secrets.PORT_DB }}
          USER_DB: ${{ secrets.USER_DB }}
          PASSWORD_DB: ${{ secrets.PASSWORD_DB }}
          HOST_DB: ${{ secrets.HOST_DB }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}