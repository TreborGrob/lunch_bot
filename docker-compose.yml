version: '3.9'

services:
  bot:
    build: .
    container_name: lunch-bot-ci
    restart: no # unless-stopped
    env_file:
      - /root/lunch-bot-deploy/.env
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 3s
      retries: 3
    container_name: mysql
    restart: no # unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${PASSWORD_DB}
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${USER_DB}
      MYSQL_PASSWORD: ${PASSWORD_DB}
    volumes:
      - /opt/RobData:/var/lib/mysql
    ports:
      - "3307:3306"
